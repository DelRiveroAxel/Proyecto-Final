{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Iurko Chacinados{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/fuentes.css' %}">
  <link rel="stylesheet" href="{% static 'css/iurko.css' %}">
  <script>try{if(localStorage.getItem('ik_tema')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}ik-body{% endblock %}">
{% block cuerpo %}{% endblock %}
<script src="{% static 'js/iurko.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
